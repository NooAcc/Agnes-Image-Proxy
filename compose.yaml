services:
  agnes-proxy:
    image: ghcr.io/nooacc/agnes-image-proxy:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # 替换为真实值；填好后不要把真实密钥提交到 git。
      PROXY_API_KEY: "replace-with-a-long-random-key"
      TURSO_DATABASE_URL: "libsql://your-database.turso.io"
      TURSO_AUTH_TOKEN: "replace-with-a-turso-token"
    volumes:
      - ./data:/data
    # 优雅退出宽限时间，超时后 Docker 强制结束。
    stop_grace_period: 60s
