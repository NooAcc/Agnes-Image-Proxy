openapi: 3.1.0
info:
  title: Agnes Image Proxy Admin API
  version: 1.0.0
  description: |
    Management console contract. Errors always use the OpenAI envelope
    `{ "error": { message, type, param, code } }`. Cookie-authenticated
    mutations require an Origin header equal to the external origin. The
    configured administrator key (`PROXY_API_KEY`) is also accepted as
    `Authorization: Bearer`; distributed `sk-agnes-` keys are never accepted here.
    Every management endpoint except `/admin/api/session*` and
    `/admin/api/storage` returns `503 initialization_required` until the
    administrator has fixed the original-image storage mode.
servers:
  - url: /
security:
  - bearer: []
  - session: []
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
    session:
      type: apiKey
      in: cookie
      name: agnes_session
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            message: { type: string }
            type: { type: string }
            param: { type: [string, "null"] }
            code: { type: [string, "null"] }
      required: [error]
    GenerationKeySummary:
      type: object
      required: [id, name, keyHint, createdAt]
      properties:
        id: { type: integer, minimum: 1 }
        name: { type: string }
        keyHint: { type: string }
        createdAt: { type: string, format: date-time }
    Session:
      type: object
      properties:
        authenticated: { type: boolean }
      required: [authenticated]
    StorageStatus:
      description: Redacted storage view; never contains the ImgBed token.
      oneOf:
        - type: object
          additionalProperties: false
          required: [initialized]
          properties:
            initialized: { const: false }
        - type: object
          additionalProperties: false
          required: [initialized, mode]
          properties:
            initialized: { const: true }
            mode: { const: local }
        - type: object
          additionalProperties: false
          required: [initialized, mode, imgbedBaseUrl, hasImgbedToken]
          properties:
            initialized: { const: true }
            mode: { const: imgbed }
            imgbedBaseUrl: { type: string, format: uri }
            hasImgbedToken: { type: boolean }
    StorageInit:
      description: Strict first-run request; unknown fields, explicit nulls and local/imgbed field mixing are rejected.
      oneOf:
        - type: object
          additionalProperties: false
          required: [mode]
          properties:
            mode: { const: local }
        - type: object
          additionalProperties: false
          required: [mode, imgbedBaseUrl, imgbedToken]
          properties:
            mode: { const: imgbed }
            imgbedBaseUrl: { type: string, format: uri, description: HTTPS origin without path, query or credentials }
            imgbedToken: { type: string, maxLength: 4096, description: Requires upload and delete permission }
    StorageUpdate:
      description: Updates ImgBed connection information only. An omitted or empty token retains the stored token; the mode cannot change.
      type: object
      additionalProperties: false
      required: [imgbedBaseUrl]
      properties:
        imgbedBaseUrl: { type: string, format: uri }
        imgbedToken: { type: string, maxLength: 4096 }
    AccountSummary:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        apiKeyMasked: { type: string }
        enabled: { type: boolean }
        status: { type: string, enum: [healthy, cooling, disabled] }
        cooldownUntil: { type: [string, "null"], format: date-time }
        failCount: { type: integer }
        lastUsedAt: { type: [string, "null"], format: date-time }
        upstreamRequests: { type: integer }
        upstreamImages: { type: integer }
        createdAt: { type: string, format: date-time }
      required: [id, name, apiKeyMasked, enabled, status, failCount]
    AccountList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AccountSummary" }
      required: [items]
    AccountCreate:
      type: object
      properties:
        name: { type: string }
        apiKey: { type: string }
      required: [name, apiKey]
      additionalProperties: false
    AccountPatch:
      type: object
      properties:
        name: { type: string }
        apiKey: { type: string }
        enabled: { type: boolean }
      additionalProperties: false
    ImportResponse:
      type: object
      properties:
        imported: { type: integer }
        errors:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              message: { type: string }
            required: [index, message]
      required: [imported, errors]
    ProbeResult:
      type: object
      properties:
        id: { type: integer }
        ok: { type: boolean }
        status: { type: integer }
        message: { type: string }
      required: [id, ok, status, message]
    ProbeList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ProbeResult" }
      required: [items]
    Settings:
      type: object
      additionalProperties: false
      properties:
        agnesBaseUrl: { type: string }
        defaultSize: { type: string, enum: [1K, 2K, 3K, 4K] }
        imageParamMode: { type: string, enum: [nested, top_level] }
        probeModel: { type: string }
        probeConcurrency: { type: integer, minimum: 1, maximum: 10 }
        requestTimeoutMs: { type: integer, minimum: 60000, maximum: 360000 }
        autoRefreshIntervalMs: { type: integer, minimum: 2000, maximum: 60000 }
        maxAttempts: { type: integer, minimum: 1, maximum: 10 }
        imageServiceBaseUrl: { type: string }
        thumbnailWidth: { type: integer, minimum: 128, maximum: 2048 }
        thumbnailQuality: { type: integer, minimum: 40, maximum: 100 }
        enrichTimeoutMs: { type: integer, minimum: 5000, maximum: 60000 }
        imageUrlTtlHours: { type: integer, minimum: 1, maximum: 720, default: 24 }
        imagePublicBaseUrl: { type: string, default: "" }
      required:
        [agnesBaseUrl, defaultSize, imageParamMode, probeModel, probeConcurrency,
         requestTimeoutMs, autoRefreshIntervalMs, maxAttempts, imageServiceBaseUrl,
         thumbnailWidth, thumbnailQuality, enrichTimeoutMs, imageUrlTtlHours, imagePublicBaseUrl]
    Attempt:
      type: object
      properties:
        index: { type: integer }
        accountId: { type: integer }
        accountName: { type: string }
        status: { type: integer }
        code: { type: string }
        durationMs: { type: integer }
        message: { type: string }
      required: [index, accountId, accountName, status, code, durationMs, message]
    DeliveryFailure:
      type: object
      additionalProperties: false
      properties:
        subrequestIndex: { type: integer }
        imageIndex: { type: integer }
        stage: { type: string, enum: [download, persist] }
        status: { type: integer }
        code: { type: string }
      required: [subrequestIndex, imageIndex, stage, status, code]
    RequestLog:
      type: object
      properties:
        id: { type: integer }
        requestId: { type: string }
        ts: { type: string, format: date-time }
        category: { type: string, enum: [request, enrich] }
        stage: { type: string }
        endpoint: { type: string }
        path: { type: string }
        model: { type: string }
        status: { type: integer }
        ok: { type: boolean }
        requested: { type: integer }
        images: { type: integer }
        failed: { type: integer }
        durationMs: { type: integer }
        sizeRequest: { type: [string, "null"] }
        sizeActual: { type: [string, "null"] }
        partial: { type: boolean }
        deliveryFailures:
          type: array
          items: { $ref: "#/components/schemas/DeliveryFailure" }
        attempts:
          type: array
          items: { $ref: "#/components/schemas/Attempt" }
      required:
        [id, requestId, ts, category, stage, endpoint, path, model, status, ok,
         requested, images, failed, durationMs, attempts, partial, deliveryFailures]
    LogPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RequestLog" }
        nextBefore: { type: [integer, "null"] }
      required: [items, nextBefore]
    UsageTotals:
      type: object
      properties:
        requests: { type: integer }
        successes: { type: integer }
        partials: { type: integer }
        failures: { type: integer }
        images: { type: integer }
      required: [requests, successes, partials, failures, images]
    Overview:
      type: object
      properties:
        startDay: { type: string, format: date }
        endDay: { type: string, format: date }
        totals: { $ref: "#/components/schemas/UsageTotals" }
        days:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/UsageTotals"
              - type: object
                properties:
                  day: { type: string, format: date }
                required: [day]
        models:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/UsageTotals"
              - type: object
                properties:
                  model: { type: string }
                required: [model]
        accounts:
          type: object
          properties:
            total: { type: integer }
            healthy: { type: integer }
            cooling: { type: integer }
            disabled: { type: integer }
          required: [total, healthy, cooling, disabled]
      required: [startDay, endDay, totals, days, models, accounts]
    NSFWScores:
      type: object
      properties:
        drawing: { type: number }
        hentai: { type: number }
        safe: { type: number }
        porn: { type: number }
        sexy: { type: number }
        isNsfw: { type: boolean }
      required: [drawing, hentai, safe, porn, sexy, isNsfw]
    GalleryItem:
      type: object
      properties:
        id: { type: integer }
        createdAt: { type: string, format: date-time }
        requestId: { type: string }
        model: { type: string }
        prompt: { type: string }
        size: { type: string }
        accountName: { type: string }
        nsfwTag: { type: string }
        nsfwScores:
          oneOf:
            - $ref: "#/components/schemas/NSFWScores"
            - type: "null"
        enrichStatus: { type: string, enum: [pending, success, failed] }
        archived: { type: boolean }
        sourceUrl: { type: [string, "null"] }
        imageUrl:
          type: [string, "null"]
          description: Public original URL with a file extension; local /images resource or direct ImgBed URL.
        thumbnailUrl:
          type: [string, "null"]
          description: Public versioned local thumbnail URL; null when unavailable.
      required:
        [id, createdAt, requestId, model, prompt, size, accountName, nsfwTag,
         enrichStatus, archived, imageUrl, thumbnailUrl]
    GalleryPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GalleryItem" }
        nextBefore: { type: [integer, "null"] }
      required: [items, nextBefore]
    BackfillStatus:
      type: object
      properties:
        running: { type: boolean }
        startedAt: { type: [string, "null"], format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
        processed: { type: integer }
        succeeded: { type: integer }
        failed: { type: integer }
        error: { type: [string, "null"] }
      required: [running, processed, succeeded, failed]
  responses:
    Error:
      description: OpenAI error envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NoContent:
      description: No content
paths:
  /images/{publicID}/{filename}:
    parameters:
      - name: publicID
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9a-f]{32}$' }
      - name: filename
        in: path
        required: true
        schema: { type: string }
        description: original.png/jpg/webp or the current thumb-{randomVersion}.png/jpg/webp filename.
    get:
      security: []
      summary: Read a public cacheable local original or versioned thumbnail
      description: |
        No Cookie/Bearer/signature required. ImgBed originals use direct file URLs instead.
        Only registered local resources are served. Deleting an image does not purge cached copies.
      responses:
        "200":
          description: Image bytes; public, max-age=31536000, immutable; no Set-Cookie.
          headers:
            Cache-Control: { schema: { type: string } }
            Content-Length: { schema: { type: integer } }
            Content-Disposition: { schema: { type: string } }
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "404": { description: Unknown ID, wrong filename/version/extension, or deleted image; no-store. }
        "503": { description: Storage unavailable; no-store. }
    head:
      security: []
      summary: Verify a public local resource and return image headers without a body
      responses:
        "200": { description: Same cache and image headers as GET; empty body. }
        "404": { description: Image not found; no-store and empty body. }
        "503": { description: Storage unavailable; no-store and empty body. }
  /admin/api/session:
    post:
      summary: Log in with the proxy key
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                apiKey: { type: string }
              required: [apiKey]
      responses:
        "200":
          description: Authenticated; sets the session cookie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Error" }
        "429":
          description: Too many failed attempts (Retry-After 60)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      summary: Read the current session (never returns the token)
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Error" }
    delete:
      summary: Log out this browser (clears the cookie only)
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
  /admin/api/session/revoke:
    post:
      summary: Revoke every session (bumps the persisted epoch)
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/api/storage:
    get:
      summary: Read the redacted storage state
      description: Always allowed, including before initialization.
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageStatus" }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    post:
      summary: Initialize the fixed original-image storage mode
      description: |
        Atomic first-run insert. A second request always returns
        409 already_initialized and never changes the fixed configuration.
        Local mode probes DATA_DIR; imgbed mode validates format only (no
        remote upload or token probe).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StorageInit" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageStatus" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    put:
      summary: Update ImgBed address and optionally the token
      description: |
        Only valid in imgbed mode. 409 not_initialized before setup and
        409 storage_mode_fixed for local storage. An empty or omitted token
        retains the stored value; null is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StorageUpdate" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageStatus" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/api/api-keys:
    get:
      summary: List active generation keys without revealing their values
      responses:
        "200":
          description: Active keys, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/GenerationKeySummary" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      summary: Create a generation-only key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "201":
          description: Created key metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerationKeySummary" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /admin/api/api-keys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      summary: Retrieve a generation key for copying (no-store)
      responses:
        "200":
          description: Full Bearer credential; do not log or cache
          content:
            application/json:
              schema:
                type: object
                required: [apiKey]
                properties:
                  apiKey: { type: string, pattern: '^sk-agnes-' }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Revoke a generation key immediately for new requests
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/api/accounts:
    get:
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountList" }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountCreate" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountSummary" }
        "400": { $ref: "#/components/responses/Error" }
  /admin/api/accounts/import:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                accounts:
                  type: array
                  maxItems: 1000
                  items: { $ref: "#/components/schemas/AccountCreate" }
              required: [accounts]
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResponse" }
        "400": { $ref: "#/components/responses/Error" }
  /admin/api/accounts/test:
    post:
      description: Probe every account through the models endpoint
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProbeList" }
  /admin/api/accounts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    patch:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountPatch" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountSummary" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/api/accounts/{id}/test:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProbeResult" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/api/accounts/{id}/reset:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/api/settings:
    get:
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
    put:
      description: Replaces the complete settings object; unknown fields are rejected
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Settings" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "400": { $ref: "#/components/responses/Error" }
  /admin/api/logs:
    get:
      parameters:
        - { name: before, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: category, in: query, schema: { type: string, enum: [request, enrich] } }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogPage" }
        "400": { $ref: "#/components/responses/Error" }
    delete:
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
  /admin/api/overview:
    get:
      parameters:
        - { name: start, in: query, schema: { type: string, format: date } }
        - { name: end, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Overview" }
        "400": { $ref: "#/components/responses/Error" }
  /admin/api/gallery:
    get:
      parameters:
        - { name: before, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: tag, in: query, schema: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GalleryPage" }
        "400": { $ref: "#/components/responses/Error" }
    delete:
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
  /admin/api/gallery/enrich:
    get:
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackfillStatus" }
    post:
      responses:
        "202":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackfillStatus" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/api/gallery/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    delete:
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/api/gallery/{id}/content:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
      - { name: download, in: query, schema: { type: string, enum: ["1"] } }
    get:
      description: Local original PNG/JPEG/WebP bytes or 404; no upstream or database BLOB fallback.
      responses:
        "200":
          description: Image bytes (nosniff, sandbox CSP)
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "404": { $ref: "#/components/responses/Error" }
  /admin/api/gallery/{id}/thumbnail:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      description: Local thumbnail or 404; only missing files read the database backup and attempt restoration. Non-missing I/O errors fail; the original is never substituted.
      responses:
        "200":
          description: Thumbnail bytes (nosniff, sandbox CSP)
          content:
            image/webp: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
        "404": { $ref: "#/components/responses/Error" }
